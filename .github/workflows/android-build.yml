
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir appsrc
          unzip "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d appsrc

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p appsrc/RideProfitAssistant assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ride-Profit-Assistant-APK
          path: appsrc/RideProfitAssistant/app/build/outputs/apk/debug/app-debug.apk
          
