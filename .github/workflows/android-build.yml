
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir appsrc
          unzip "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d appsrc

      - name: Fix Java Kotlin versions
        run: |
          FILE="appsrc/RideProfitAssistant/app/build.gradle.kts"
          python3 -c "p='$FILE'; s=open(p).read(); s=s.replace('    defaultConfig {', '    compileOptions {\\n        sourceCompatibility = JavaVersion.VERSION_17\\n        targetCompatibility = JavaVersion.VERSION_17\\n    }\\n    kotlinOptions {\\n        jvmTarget = \"17\"\\n    }\\n    defaultConfig {'); open(p,'w').write(s)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p appsrc/RideProfitAssistant assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ride-Profit-Assistant-APK
          path: appsrc/RideProfitAssistant/app/build/outputs/apk/debug/app-debug.apk
